# Assignment 1, Part A: your loop's three bounds. Pick each value and say why, in one
# line, next to it. Framework defaults are no guide (Week 1, slide 18): they
# measure different units and they move. Treat the bound as yours to set.
#
# max_tokens must sit below the harness ceiling in settings.yaml
# (session_token_ceiling), so that your loop, not the harness, ends the run.

max_steps: 12         # why: one triage needs about 6 calls (read the issue, a few searches, post, stop), so 12 leaves room to spare but still stops an agent that keeps searching in circles
max_tokens: 50000     # why: I estimated about 23,000 prompt tokens for a run that hits 12 steps, so 50,000 only kicks in if tool results get much bigger than I expect, and it's well under the 400,000 harness limit
wall_clock_s: 300     # why: 12 calls at about 3 seconds each is under a minute, and the extra time covers the free tier's rate-limit waits, but a run that gets stuck still ends after 5 minutes
